<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e113a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="voiceWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="aiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)"/>

  <!-- Neural Net Connections in Background -->
  <g opacity="0.15" stroke="#a855f7" stroke-width="1.5">
    <line x1="120" y1="80" x2="280" y2="180"/>
    <line x1="280" y1="180" x2="380" y2="90"/>
    <line x1="380" y1="90" x2="520" y2="160"/>
    <line x1="520" y1="160" x2="680" y2="100"/>
    <line x1="280" y1="180" x2="350" y2="340"/>
    <line x1="350" y1="340" x2="520" y2="380"/>
    <circle cx="120" cy="80" r="4" fill="#6366f1"/>
    <circle cx="280" cy="180" r="6" fill="#a855f7"/>
    <circle cx="380" cy="90" r="5" fill="#ec4899"/>
    <circle cx="520" cy="160" r="7" fill="#06b6d4"/>
    <circle cx="680" cy="100" r="4" fill="#a855f7"/>
  </g>

  <!-- Left: AI Avatar Video Stage -->
  <g transform="translate(60, 50)" filter="url(#aiShadow)">
    <rect x="0" y="0" width="340" height="400" rx="20" fill="#13192b" stroke="#3730a3" stroke-width="2"/>
    <rect x="15" y="15" width="310" height="260" rx="14" fill="#1e1b4b"/>
    
    <!-- Stylized Avatar Silhouette -->
    <circle cx="170" cy="105" r="45" fill="url(#aiGradient)"/>
    <path d="M 105 230 C 105 170, 235 170, 235 230 Z" fill="url(#aiGradient)" opacity="0.85"/>
    <circle cx="170" cy="105" r="40" fill="#0f172a" opacity="0.3"/>
    
    <!-- Facial Mesh Tracker Grid -->
    <circle cx="158" cy="100" r="3" fill="#38bdf8"/>
    <circle cx="182" cy="100" r="3" fill="#38bdf8"/>
    <ellipse cx="170" cy="122" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="170" y1="90" x2="170" y2="115" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Badge: Real-time Lip-sync -->
    <rect x="30" y="30" width="130" height="26" rx="13" fill="rgba(0,0,0,0.6)"/>
    <circle cx="45" cy="43" r="5" fill="#10b981"/>
    <text x="58" y="47" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="10">AI Voice Sync 99.8%</text>

    <!-- Lower info -->
    <text x="25" y="305" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">AI Brand Spokesperson</text>
    <text x="25" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11">Multi-lingual Prompt Scripting (EN/HI/TE)</text>
    <rect x="25" y="345" width="80" height="24" rx="6" fill="#312e81"/>
    <text x="65" y="361" fill="#c7d2fe" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">HeyGen / D-ID</text>
    <rect x="115" y="345" width="80" height="24" rx="6" fill="#312e81"/>
    <text x="155" y="361" fill="#c7d2fe" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">ElevenLabs</text>
    <rect x="205" y="345" width="70" height="24" rx="6" fill="#312e81"/>
    <text x="240" y="361" fill="#c7d2fe" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">ChatGPT</text>
  </g>

  <!-- Right: Prompt Engineering & Generation Flow -->
  <g transform="translate(430, 50)" filter="url(#aiShadow)">
    <rect x="0" y="0" width="310" height="400" rx="20" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="42" rx="20" fill="#1f2937"/>
    <text x="20" y="26" fill="#f3f4f6" font-family="sans-serif" font-weight="700" font-size="12">AI Prompt Workflow</text>
    
    <!-- Code/Prompt card 1 -->
    <rect x="18" y="60" width="274" height="85" rx="10" fill="#1e293b"/>
    <text x="32" y="82" fill="#a78bfa" font-family="monospace" font-size="10">> System Prompt:</text>
    <text x="32" y="100" fill="#e2e8f0" font-family="sans-serif" font-size="10">"Deliver energetic 45s product intro</text>
    <text x="32" y="116" fill="#e2e8f0" font-family="sans-serif" font-size="10">emphasizing modern work-from-home"</text>
    <text x="32" y="132" fill="#34d399" font-family="monospace" font-size="9">Tone: Warm, Authoritative, Engaging</text>

    <!-- Voice synthesizer preview -->
    <rect x="18" y="160" width="274" height="85" rx="10" fill="#1e293b"/>
    <text x="32" y="182" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Natural AI Voiceover Synthesis</text>
    <rect x="32" y="196" width="246" height="34" rx="6" fill="#0f172a"/>
    <path d="M 40 213 L 55 200 L 70 220 L 85 205 L 100 225 L 115 198 L 130 223 L 145 202 L 160 219 L 175 206 L 190 225 L 205 200 L 220 220 L 235 205 L 250 215 L 265 210" fill="none" stroke="url(#voiceWave)" stroke-width="2.5"/>

    <!-- Output benefits -->
    <rect x="18" y="260" width="274" height="115" rx="10" fill="#1e293b"/>
    <text x="32" y="285" fill="#fbbf24" font-family="sans-serif" font-weight="700" font-size="12">Key Results</text>
    <text x="32" y="307" fill="#cbd5e1" font-family="sans-serif" font-size="11">⚡ 10x Faster Video Output</text>
    <text x="32" y="327" fill="#cbd5e1" font-family="sans-serif" font-size="11">🌍 Multi-Language Localization</text>
    <text x="32" y="347" fill="#cbd5e1" font-family="sans-serif" font-size="11">💰 80% Reduction in Production Cost</text>
  </g>
</svg>
