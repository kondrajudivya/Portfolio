<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ecomShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ecomBg)"/>

  <!-- Glowing organic orb -->
  <circle cx="700" cy="150" r="160" fill="#10b981" opacity="0.12" filter="blur(60px)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 40)" filter="url(#ecomShadow)">
    <rect x="0" y="0" width="680" height="420" rx="16" fill="#fcfbf7" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Top Nav -->
    <rect x="0" y="0" width="680" height="44" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="35" y="27" fill="#065f46" font-family="sans-serif" font-weight="800" font-size="14">🌿 EcoBloom</text>
    
    <text x="220" y="27" fill="#374151" font-family="sans-serif" font-size="11">Shop Organic</text>
    <text x="310" y="27" fill="#374151" font-family="sans-serif" font-size="11">Best Sellers</text>
    <text x="390" y="27" fill="#374151" font-family="sans-serif" font-size="11">Sustainability</text>

    <!-- Cart Badge -->
    <rect x="580" y="10" width="75" height="24" rx="12" fill="#047857"/>
    <text x="617" y="26" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Cart (3)</text>

    <!-- Banner -->
    <rect x="30" y="60" width="620" height="150" rx="12" fill="#ecfdf5"/>
    <text x="55" y="105" fill="#064e3b" font-family="sans-serif" font-weight="800" font-size="22">Pure Nature Delivered.</text>
    <text x="55" y="130" fill="#047857" font-family="sans-serif" font-size="12">Ethically sourced skincare & wellness essentials.</text>
    <rect x="55" y="148" width="115" height="32" rx="16" fill="#059669"/>
    <text x="112" y="168" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Explore Collection</text>
    
    <!-- Big product showcase photo circle -->
    <circle cx="530" cy="135" r="55" fill="#a7f3d0"/>
    <circle cx="530" cy="135" r="42" fill="#34d399"/>
    <text x="530" y="142" font-size="34" text-anchor="middle">🧴</text>

    <!-- Product Grid (3 cards) -->
    <!-- Card 1 -->
    <rect x="30" y="230" width="195" height="165" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="45" y="240" width="165" height="90" rx="8" fill="#f0fdf4"/>
    <text x="127" y="295" font-size="32" text-anchor="middle">🌱</text>
    <text x="45" y="348" fill="#111827" font-family="sans-serif" font-weight="700" font-size="11">Hydra Botanic Serum</text>
    <text x="45" y="368" fill="#059669" font-family="sans-serif" font-weight="800" font-size="12">₹ 799</text>
    <rect x="155" y="352" width="55" height="22" rx="6" fill="#10b981"/>
    <text x="182" y="367" fill="#fff" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">+ Add</text>

    <!-- Card 2 -->
    <rect x="242" y="230" width="195" height="165" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="257" y="240" width="165" height="90" rx="8" fill="#fefce8"/>
    <text x="339" y="295" font-size="32" text-anchor="middle">✨</text>
    <text x="257" y="348" fill="#111827" font-family="sans-serif" font-weight="700" font-size="11">Glow Radiance Oil</text>
    <text x="257" y="368" fill="#d97706" font-family="sans-serif" font-weight="800" font-size="12">₹ 1,199</text>
    <rect x="367" y="352" width="55" height="22" rx="6" fill="#f59e0b"/>
    <text x="394" y="367" fill="#fff" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">+ Add</text>

    <!-- Card 3 -->
    <rect x="455" y="230" width="195" height="165" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="470" y="240" width="165" height="90" rx="8" fill="#fdf2f8"/>
    <text x="552" y="295" font-size="32" text-anchor="middle">🌸</text>
    <text x="470" y="348" fill="#111827" font-family="sans-serif" font-weight="700" font-size="11">Rose Petal Mist</text>
    <text x="470" y="368" fill="#db2777" font-family="sans-serif" font-weight="800" font-size="12">₹ 549</text>
    <rect x="580" y="352" width="55" height="22" rx="6" fill="#ec4899"/>
    <text x="607" y="367" fill="#fff" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">+ Add</text>
  </g>
</svg>
