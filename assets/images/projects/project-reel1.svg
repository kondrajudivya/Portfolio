<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Glowing background elements -->
  <circle cx="240" cy="180" r="140" fill="#f43f5e" opacity="0.22" filter="blur(50px)"/>
  <circle cx="580" cy="320" r="160" fill="#8b5cf6" opacity="0.2" filter="blur(60px)"/>

  <!-- Phone Mockup Container (Vertical Reel) -->
  <g transform="translate(140, 45)" filter="url(#shadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="220" height="410" rx="32" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Screen area -->
    <rect x="8" y="8" width="204" height="394" rx="26" fill="#18181b"/>
    <!-- Video scene mockup -->
    <rect x="8" y="8" width="204" height="394" rx="26" fill="url(#accentGrad)" opacity="0.85"/>
    
    <!-- Phone notch -->
    <rect x="75" y="14" width="70" height="14" rx="7" fill="#090d16"/>

    <!-- Reel overlay UI -->
    <!-- Play button icon -->
    <circle cx="110" cy="195" r="32" fill="rgba(0,0,0,0.5)" stroke="#ffffff" stroke-width="2"/>
    <polygon points="104,180 124,195 104,210" fill="#ffffff"/>

    <!-- Subtitle / Caption simulation -->
    <rect x="25" y="270" width="170" height="26" rx="6" fill="rgba(0,0,0,0.75)"/>
    <text x="110" y="287" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="middle">🔥 3 SEC VIRAL HOOK</text>
    
    <!-- Social UI buttons on the right -->
    <circle cx="192" cy="230" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="192" cy="260" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="192" cy="290" r="10" fill="rgba(255,255,255,0.2)"/>
    
    <text x="25" y="360" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="11">@brand_campaign</text>
    <text x="25" y="378" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">Dynamic transitions & pacing ⚡</text>
  </g>

  <!-- Timeline & Editing Waveform Panel -->
  <g transform="translate(410, 85)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="340" height="330" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <!-- Window header -->
    <rect x="0" y="0" width="340" height="38" rx="16" fill="#1f2937"/>
    <circle cx="22" cy="19" r="5" fill="#ef4444"/>
    <circle cx="38" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="19" r="5" fill="#10b981"/>
    <text x="170" y="24" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Timeline: Viral_Reel_Edit.prproj</text>

    <!-- Editing Tracks -->
    <!-- Video Track 1 -->
    <rect x="18" y="55" width="304" height="42" rx="8" fill="#1e293b"/>
    <rect x="22" y="59" width="70" height="34" rx="6" fill="#3b82f6"/>
    <rect x="96" y="59" width="110" height="34" rx="6" fill="#6366f1"/>
    <rect x="210" y="59" width="108" height="34" rx="6" fill="#ec4899"/>
    <text x="57" y="80" fill="#fff" font-family="sans-serif" font-size="10" text-anchor="middle">Hook.mp4</text>
    <text x="151" y="80" fill="#fff" font-family="sans-serif" font-size="10" text-anchor="middle">Product_B-Roll</text>
    <text x="264" y="80" fill="#fff" font-family="sans-serif" font-size="10" text-anchor="middle">CTA_End.mp4</text>

    <!-- Video Track 2 - Text/FX -->
    <rect x="18" y="105" width="304" height="35" rx="8" fill="#1e293b"/>
    <rect x="35" y="109" width="60" height="27" rx="5" fill="#f59e0b"/>
    <rect x="120" y="109" width="80" height="27" rx="5" fill="#f59e0b"/>
    <rect x="230" y="109" width="70" height="27" rx="5" fill="#10b981"/>
    <text x="65" y="126" fill="#111" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">Subtitles</text>
    <text x="160" y="126" fill="#111" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">Zoom FX</text>
    <text x="265" y="126" fill="#111" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">Sound FX</text>

    <!-- Audio Track & Waveform -->
    <rect x="18" y="148" width="304" height="45" rx="8" fill="#0f172a"/>
    <path d="M 25 170 Q 35 155, 45 170 T 65 170 T 85 150 T 105 185 T 125 160 T 145 178 T 165 152 T 185 180 T 205 160 T 225 175 T 245 155 T 265 178 T 285 162 T 305 170" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Key Metrics Badges -->
    <rect x="18" y="210" width="144" height="65" rx="10" fill="#1f2937" stroke="#374151"/>
    <text x="32" y="234" fill="#94a3b8" font-family="sans-serif" font-size="11">Average Retention</text>
    <text x="32" y="260" fill="#34d399" font-family="sans-serif" font-weight="800" font-size="20">84.6% ↑</text>

    <rect x="178" y="210" width="144" height="65" rx="10" fill="#1f2937" stroke="#374151"/>
    <text x="192" y="234" fill="#94a3b8" font-family="sans-serif" font-size="11">Target Audience</text>
    <text x="192" y="260" fill="#fbbf24" font-family="sans-serif" font-weight="800" font-size="16">Gen-Z & Pros</text>

    <!-- Tagline -->
    <text x="170" y="306" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Pacing • Motion Graphics • Trending Audio</text>
  </g>
</svg>
