<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="saanviBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="warmOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="biryaniBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#saanviBg)"/>

  <!-- Warm ambient glow -->
  <circle cx="700" cy="120" r="180" fill="#f97316" opacity="0.18" filter="blur(70px)"/>
  <circle cx="150" cy="400" r="160" fill="#ea580c" opacity="0.15" filter="blur(60px)"/>

  <!-- Browser Container -->
  <g transform="translate(60, 40)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="680" height="420" rx="16" fill="#fffbeb" stroke="#f97316" stroke-width="2"/>
    
    <!-- Browser Header -->
    <rect x="0" y="0" width="680" height="42" rx="16" fill="#fef3c7"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="130" y="8" width="420" height="26" rx="13" fill="#ffffff" stroke="#fde68a"/>
    <text x="340" y="25" fill="#9a3412" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">🔒 https://kondrajudivya.github.io/Saanvi-s-Kitchen/</text>

    <!-- Top Announcement Bar in Page -->
    <rect x="0" y="42" width="680" height="22" fill="#7c2d12"/>
    <text x="340" y="56" fill="#fed7aa" font-family="sans-serif" font-size="9" text-anchor="middle">📍 Annapoorneswari Nilayam, Madiwala, Bengaluru • 📞 WhatsApp Direct Order</text>

    <!-- Page Navbar -->
    <rect x="25" y="74" width="630" height="40" rx="8" fill="#ffffff" stroke="#fed7aa"/>
    <text x="45" y="99" fill="#9a3412" font-family="sans-serif" font-weight="900" font-size="15">🍲 Saanvi's Kitchen</text>
    <text x="360" y="98" fill="#78350f" font-family="sans-serif" font-weight="600" font-size="10">Dine-in</text>
    <text x="420" y="98" fill="#78350f" font-family="sans-serif" font-weight="600" font-size="10">Specialties</text>
    <text x="490" y="98" fill="#78350f" font-family="sans-serif" font-weight="600" font-size="10">Location</text>
    <rect x="555" y="81" width="90" height="26" rx="13" fill="#25d366"/>
    <text x="600" y="97" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Order Now 💬</text>

    <!-- Hero Banner -->
    <rect x="25" y="124" width="630" height="135" rx="12" fill="url(#warmOrange)"/>
    
    <text x="50" y="158" fill="#ffedd5" font-family="sans-serif" font-weight="700" font-size="11">AUTHENTIC TASTE • MADE WITH LOVE</text>
    <text x="50" y="188" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22">Madiwala's Favorite</text>
    <text x="50" y="214" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22">South Indian & Biryani Hub</text>
    
    <rect x="50" y="226" width="125" height="26" rx="13" fill="#1c1917"/>
    <text x="112" y="243" fill="#fef08a" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Explore Menu →</text>

    <!-- Visual Food Circle in Hero -->
    <circle cx="560" cy="190" r="48" fill="#ffffff" opacity="0.2"/>
    <circle cx="560" cy="190" r="38" fill="url(#biryaniBadge)"/>
    <text x="560" y="200" font-size="34" text-anchor="middle">🍗</text>

    <!-- 3 Signature Dishes Cards -->
    <!-- Dish 1: Chicken Dum Biryani -->
    <rect x="25" y="272" width="195" height="125" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="35" y="282" width="45" height="45" rx="8" fill="#fff7ed"/>
    <text x="57" y="312" font-size="22" text-anchor="middle">🍗</text>
    <text x="90" y="298" fill="#9a3412" font-family="sans-serif" font-weight="800" font-size="11">Chicken Dum Biryani</text>
    <text x="90" y="316" fill="#16a34a" font-family="sans-serif" font-weight="800" font-size="12">₹ 180</text>
    <text x="35" y="348" fill="#78350f" font-family="sans-serif" font-size="9">Fragrant basmati cooked with</text>
    <text x="35" y="362" fill="#78350f" font-family="sans-serif" font-size="9">rich spiced masala & tender chicken.</text>
    <rect x="35" y="372" width="70" height="18" rx="4" fill="#25d366"/>
    <text x="70" y="385" fill="#fff" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">Order WhatsApp</text>

    <!-- Dish 2: Masala Dosa -->
    <rect x="242" y="272" width="195" height="125" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="252" y="282" width="45" height="45" rx="8" fill="#fefce8"/>
    <text x="274" y="312" font-size="22" text-anchor="middle">🥞</text>
    <text x="307" y="298" fill="#9a3412" font-family="sans-serif" font-weight="800" font-size="11">Crispy Masala Dosa</text>
    <text x="307" y="316" fill="#16a34a" font-family="sans-serif" font-weight="800" font-size="12">₹ 70</text>
    <text x="252" y="348" fill="#78350f" font-family="sans-serif" font-size="9">Golden brown crispy crepe with</text>
    <text x="252" y="362" fill="#78350f" font-family="sans-serif" font-size="9">spiced potato filling & chutneys.</text>
    <rect x="252" y="372" width="70" height="18" rx="4" fill="#25d366"/>
    <text x="287" y="385" fill="#fff" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">Order WhatsApp</text>

    <!-- Dish 3: Filter Coffee -->
    <rect x="460" y="272" width="195" height="125" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="470" y="282" width="45" height="45" rx="8" fill="#fef2f2"/>
    <text x="492" y="312" font-size="22" text-anchor="middle">☕</text>
    <text x="525" y="298" fill="#9a3412" font-family="sans-serif" font-weight="800" font-size="11">South Indian Coffee</text>
    <text x="525" y="316" fill="#16a34a" font-family="sans-serif" font-weight="800" font-size="12">₹ 25</text>
    <text x="470" y="348" fill="#78350f" font-family="sans-serif" font-size="9">Freshly brewed aromatic chicory</text>
    <text x="470" y="362" fill="#78350f" font-family="sans-serif" font-size="9">blend with frothy hot milk.</text>
    <rect x="470" y="372" width="70" height="18" rx="4" fill="#25d366"/>
    <text x="505" y="385" fill="#fff" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">Order WhatsApp</text>
  </g>
</svg>
