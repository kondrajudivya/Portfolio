<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="mktShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#mktBg)"/>

  <g transform="translate(60, 45)" filter="url(#mktShadow)">
    <rect x="0" y="0" width="680" height="410" rx="18" fill="#131929" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Header -->
    <rect x="0" y="0" width="680" height="48" rx="18" fill="#1e293b"/>
    <text x="30" y="29" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">📈 30-Day Social Media Growth Campaign</text>
    <rect x="520" y="12" width="130" height="24" rx="12" fill="#059669"/>
    <text x="585" y="28" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">ACTIVE CAMPAIGN</text>

    <!-- 3 Stat KPI Cards -->
    <rect x="25" y="65" width="195" height="80" rx="12" fill="#1e293b" stroke="#374151"/>
    <text x="40" y="88" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Impressions</text>
    <text x="40" y="120" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="22">1.2M +</text>
    <text x="135" y="120" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="11">↑ 240%</text>

    <rect x="242" y="65" width="195" height="80" rx="12" fill="#1e293b" stroke="#374151"/>
    <text x="257" y="88" fill="#94a3b8" font-family="sans-serif" font-size="11">Follower Growth</text>
    <text x="257" y="120" fill="#fbbf24" font-family="sans-serif" font-weight="800" font-size="22">+18,450</text>
    <text x="365" y="120" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="11">↑ 185%</text>

    <rect x="460" y="65" width="195" height="80" rx="12" fill="#1e293b" stroke="#374151"/>
    <text x="475" y="88" fill="#94a3b8" font-family="sans-serif" font-size="11">Engagement Rate</text>
    <text x="475" y="120" fill="#f43f5e" font-family="sans-serif" font-weight="800" font-size="22">8.7%</text>
    <text x="540" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">(Industry avg: 2.1%)</text>

    <!-- Main Chart Panel -->
    <rect x="25" y="160" width="630" height="225" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="45" y="188" fill="#cbd5e1" font-family="sans-serif" font-weight="600" font-size="12">Reach & Viral Trajectory Curve</text>
    
    <!-- Grid lines -->
    <line x1="45" y1="220" x2="630" y2="220" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>
    <line x1="45" y1="260" x2="630" y2="260" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>
    <line x1="45" y1="300" x2="630" y2="300" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8"/>
    <line x1="45" y1="340" x2="630" y2="340" stroke="#334155" stroke-width="1"/>

    <!-- Chart polygon and line -->
    <path d="M 50 330 Q 150 320, 240 285 T 420 220 T 520 180 T 620 120 L 620 340 L 50 340 Z" fill="url(#chartArea)"/>
    <path d="M 50 330 Q 150 320, 240 285 T 420 220 T 520 180 T 620 120" fill="none" stroke="url(#growthGrad)" stroke-width="3.5"/>

    <!-- Data points -->
    <circle cx="240" cy="285" r="5" fill="#f43f5e"/>
    <circle cx="420" cy="220" r="5" fill="#fb923c"/>
    <circle cx="620" cy="120" r="7" fill="#fbbf24"/>
    
    <!-- Milestone pill -->
    <rect x="520" y="85" width="115" height="26" rx="6" fill="#f43f5e"/>
    <text x="577" y="102" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="10" text-anchor="middle">Viral Reel: 850k+ views</text>

    <!-- X-axis labels -->
    <text x="50" y="360" fill="#64748b" font-family="sans-serif" font-size="10">Day 1</text>
    <text x="180" y="360" fill="#64748b" font-family="sans-serif" font-size="10">Day 7</text>
    <text x="320" y="360" fill="#64748b" font-family="sans-serif" font-size="10">Day 15</text>
    <text x="460" y="360" fill="#64748b" font-family="sans-serif" font-size="10">Day 22</text>
    <text x="600" y="360" fill="#64748b" font-family="sans-serif" font-size="10">Day 30</text>
  </g>
</svg>
