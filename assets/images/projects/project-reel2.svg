<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1821"/>
      <stop offset="60%" stop-color="#1e2d2f"/>
      <stop offset="100%" stop-color="#041416"/>
    </linearGradient>
    <linearGradient id="goldenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <circle cx="650" cy="130" r="150" fill="#f59e0b" opacity="0.12" filter="blur(60px)"/>
  <circle cx="180" cy="380" r="160" fill="#14b8a6" opacity="0.15" filter="blur(70px)"/>

  <!-- Desktop / Ultrawide Video Monitor -->
  <g transform="translate(80, 50)" filter="url(#shadow2)">
    <rect x="0" y="0" width="640" height="380" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="640" height="40" rx="16" fill="#1e293b"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="320" y="25" fill="#cbd5e1" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">Color Grading Studio • Cinematic Narrative</text>

    <!-- Split Screen: Before & After Color Grading -->
    <!-- Left: Before Grading (Muted / Flat) -->
    <rect x="25" y="60" width="285" height="230" rx="10" fill="#475569"/>
    <rect x="35" y="75" width="265" height="150" rx="8" fill="#64748b" opacity="0.6"/>
    <path d="M 45 200 L 110 120 L 180 180 L 230 140 L 290 200 Z" fill="#334155"/>
    <circle cx="100" cy="110" r="22" fill="#94a3b8"/>
    <rect x="40" y="240" width="90" height="24" rx="6" fill="#1e293b"/>
    <text x="85" y="256" fill="#cbd5e1" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">RAW / FLAT</text>
    <text x="145" y="256" fill="#94a3b8" font-family="sans-serif" font-size="10">Uncorrected Log</text>

    <!-- Slider Divider Bar -->
    <line x1="320" y1="60" x2="320" y2="290" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="320" cy="175" r="14" fill="#f59e0b"/>
    <polygon points="314,175 326,170 326,180" fill="#111"/>

    <!-- Right: After Grading (Vibrant / Cinematic) -->
    <rect x="330" y="60" width="285" height="230" rx="10" fill="#0f766e"/>
    <rect x="340" y="75" width="265" height="150" rx="8" fill="url(#goldenGlow)" opacity="0.4"/>
    <path d="M 350 200 L 415 120 L 485 180 L 535 140 L 595 200 Z" fill="#134e4a"/>
    <circle cx="405" cy="110" r="22" fill="#fbbf24"/>
    <rect x="345" y="240" width="130" height="24" rx="6" fill="#042f2e"/>
    <text x="410" y="256" fill="#2dd4bf" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">GRADED & MASTERED</text>
    <text x="490" y="256" fill="#fde68a" font-family="sans-serif" font-size="10">Warm Tone Curve</text>

    <!-- Lower Controls Bar -->
    <rect x="25" y="305" width="590" height="55" rx="10" fill="#1e293b"/>
    <text x="45" y="337" fill="#94a3b8" font-family="sans-serif" font-size="12">Tools Used: Adobe Premiere Pro • DaVinci Color Tone • CapCut Pro</text>
    <rect x="490" y="317" width="110" height="32" rx="6" fill="#d97706"/>
    <text x="545" y="337" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">4K 60FPS EXPORT</text>
  </g>
</svg>
